[project]
name = "qualmz"
version = "0.1.0"
description = "A researcher gets a fixed number of looks at the holdout, and re-running the same configuration does not buy another one"
requires-python = ">=3.11,<3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260815",
]
# The store the budget is enforced IN. Separate from the default install because the offline
# suite runs the same rules against SQLite, and the claim that it does is worth being able to
# check by looking at one file.
store = [
    "psycopg[binary]>=3.2",
]
# The DAG. Airflow is a large install and it is here because the interesting property of a
# promotion pipeline is what happens when a gate fails, which a script cannot demonstrate.
orchestration = [
    "apache-airflow>=3.3",
]
# The promotion machinery. Great Expectations declares `<3.14,>=3.10`, which is what fixes this
# repository's upper bound: a floor of 3.11 and a ceiling below 3.14, matching the CI matrix.
promotion = [
    "great-expectations>=1.21",
    "mlflow>=3.15",
    "numpy>=2.1",
    "pandas>=2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qualmz"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.mypy]
files = ["src", "tests", "tests_store", "scripts", "dags"]
strict = true

[[tool.mypy.overrides]]
# pandas ships no stubs of its own (pandas-stubs is a separate project) and Great Expectations
# re-exports its expectation classes without declaring them in `__all__`, so mypy refuses to see
# names that exist and work. Both are declared here rather than excluding the file, so
# everything else in scripts/measure_promotion.py is still checked. Verified rather than
# assumed: `great_expectations.expectations.ExpectColumnValuesToNotBeNull` imports and runs.
module = [
    "pandas",
    "great_expectations.expectations",
    "mlflow",
    "mlflow.*",
    "airflow.*",
]
ignore_missing_imports = true
# AND implicit_reexport, WHICH ignore_missing_imports DOES NOT COVER. `strict` turns off
# implicit re-export, and Great Expectations exposes its expectation classes through a module
# that does not list them in `__all__`, so mypy refuses names that import and run. That is a
# packaging detail of theirs rather than a defect here, and narrowing it to these modules keeps
# the rule on for everything else.
implicit_reexport = true
