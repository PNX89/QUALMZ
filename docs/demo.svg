<text x="18" y="34" class="cmd" style="animation:l0 5190ms steps(1,end) infinite">$ uv run python examples/the_second_look.py</text><text x="18" y="53" style="animation:l1 5190ms steps(1,end) infinite"></text><text x="18" y="72" style="animation:l2 5190ms steps(1,end) infinite">momentum has 3 looks at the 2024H2 holdout.</text><text x="18" y="91" style="animation:l3 5190ms steps(1,end) infinite"></text><text x="18" y="110" style="animation:l4 5190ms steps(1,end) infinite">  the first idea                             a new look   1 of 3 used</text><text x="18" y="129" style="animation:l5 5190ms steps(1,end) infinite">  the same thing again, after a crash        not a new look   1 of 3 used</text><text x="18" y="148" style="animation:l6 5190ms steps(1,end) infinite">  the same thing with the keys reordered     not a new look   1 of 3 used</text><text x="18" y="167" style="animation:l7 5190ms steps(1,end) infinite">  a longer lookback                          a new look   2 of 3 used</text><text x="18" y="186" style="animation:l8 5190ms steps(1,end) infinite">  and a different threshold                  a new look   3 of 3 used</text><text x="18" y="205" style="animation:l9 5190ms steps(1,end) infinite">  one more idea                              REFUSED</text><text x="18" y="224" style="animation:l10 5190ms steps(1,end) infinite">      &apos;momentum&apos; has taken 3 of 3 looks at &apos;2024H2&apos;, and this configuration has not been eval...</text><text x="18" y="243" style="animation:l11 5190ms steps(1,end) infinite"></text><text x="18" y="262" style="animation:l12 5190ms steps(1,end) infinite">  The second and third rows are the point. A crash and a reordered dictionary</text><text x="18" y="281" style="animation:l13 5190ms steps(1,end) infinite">  are the same configuration, so neither costs anything, and the count does not</text><text x="18" y="300" style="animation:l14 5190ms steps(1,end) infinite">  move. A changed parameter is a different question, so it does.</text><text x="18" y="319" style="animation:l15 5190ms steps(1,end) infinite"></text><text x="18" y="338" style="animation:l16 5190ms steps(1,end) infinite">  The constraint is in the schema rather than in this file, so an insert that</text><text x="18" y="357" style="animation:l17 5190ms steps(1,end) infinite">  goes around it entirely still fails.</text>
</svg>
